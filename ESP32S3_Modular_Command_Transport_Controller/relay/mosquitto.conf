persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
per_listener_settings true
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/secrets/acl
certfile /mosquitto/secrets/broker.crt
keyfile /mosquitto/secrets/broker.key
tls_version tlsv1.2
require_certificate false
max_packet_size 16384
message_size_limit 12288
max_queued_messages 8
max_inflight_messages 4
max_connections 12
retain_available false

